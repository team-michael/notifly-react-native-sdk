name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to be released (x.y.z, x.y.z-alpha.N, x.y.z-beta.N, or x.y.z-SNAPSHOT)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        run: npm install -g npm@11.5.1

      - name: Validate release version and channel
        id: release_channel
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          test "$(node -p "require('./package.json').version")" = "$VERSION"

          number='(0|[1-9][0-9]*)'
          base_version="$number\\.$number\\.$number"
          if [[ "$VERSION" =~ ^$base_version$ ]]; then
            npm_tag=latest
            prerelease=false
          elif [[ "$VERSION" =~ ^$base_version-alpha\.$number$ ]]; then
            npm_tag=alpha
            prerelease=true
          elif [[ "$VERSION" =~ ^$base_version-beta\.$number$ ]]; then
            npm_tag=beta
            prerelease=true
          elif [[ "$VERSION" =~ ^$base_version-SNAPSHOT$ ]]; then
            npm_tag=snapshot
            prerelease=true
          else
            echo "Unsupported release version: $VERSION" >&2
            exit 1
          fi
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Read Changelog
        id: read_changelog
        if: ${{ !endsWith(github.event.inputs.version, 'SNAPSHOT') }}
        uses: mindsers/changelog-reader-action@v2
        with:
          version: ${{ github.event.inputs.version }}

      - name: Build package
        run: npm run build

      - name: Create GitHub Release
        if: steps.read_changelog.outputs.changes
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          body: ${{ steps.read_changelog.outputs.changes }}
          commit: ${{ github.sha }}
          prerelease: ${{ steps.release_channel.outputs.prerelease }}
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        env:
          NPM_DIST_TAG: ${{ steps.release_channel.outputs.npm_tag }}
        run: npm publish --provenance --access public --tag "$NPM_DIST_TAG"
